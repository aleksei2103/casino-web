<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #f39c12; --bg: #1c1c1e; --card: #2c2c2e; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; text-align: center; user-select: none; }
        .header { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #3a3a3c; }
        .balance { font-size: 24px; color: var(--gold); font-weight: bold; }
        
        .game-board { display: grid; grid-template-rows: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; opacity: 0.5; pointer-events: none; }
        .row.active { opacity: 1; pointer-events: auto; }
        .cell { background: var(--card); border-radius: 10px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid #3a3a3c; }
        .cell.win { border-color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .cell.lose { border-color: #e74c3c; background: rgba(231, 76, 60, 0.1); }

        .controls { background: var(--card); padding: 15px; border-radius: 15px; }
        .btn-play { background: var(--gold); color: black; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 18px; }
        .win-screen { display: none; color: var(--gold); font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-size: 12px; color: #8e8e93;">ВАШ БАЛАНС</div>
    <div class="balance" id="balance">1000.00</div>
</div>

<div id="win-msg" class="win-screen">ВЫ ВЫИГРАЛИ! +200.00</div>

<div class="game-board" id="board">
    <!-- Ряды создаются автоматически -->
</div>

<div class="controls">
    <button class="btn-play" id="action-btn" onclick="startGame()">ИГРАТЬ (100.00)</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let balance = 1000;
    let currentRow = 0;
    const totalRows = 5;

    function initBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        for (let i = totalRows - 1; i >= 0; i--) {
            let row = document.createElement('div');
            row.className = 'row';
            row.id = `row-${i}`;
            for (let j = 0; j < 3; j++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerHTML = '❓';
                cell.onclick = () => makeMove(i, j);
                row.appendChild(cell);
            }
            board.appendChild(row);
        }
    }

    function startGame() {
        if (balance < 100) return;
        tg.HapticFeedback.impactOccurred('medium');
        balance -= 100;
        updateBalance();
        currentRow = 0;
        initBoard();
        activateRow(0);
        document.getElementById('action-btn').style.display = 'none';
        document.getElementById('win-msg').style.display = 'none';
    }

    function activateRow(index) {
        document.querySelectorAll('.row').forEach(r => r.classList.remove('active'));
        let row = document.getElementById(`row-${index}`);
        if (row) row.classList.add('active');
    }

    function makeMove(rowIndex, cellIndex) {
        if (rowIndex !== currentRow) return;
        
        // Шанс 60% на успех
        let isWin = Math.random() > 0.4;
        let row = document.getElementById(`row-${rowIndex}`);
        let cell = row.children[cellIndex];

        if (isWin) {
            tg.HapticFeedback.notificationOccurred('success');
            cell.innerHTML = '🍎';
            cell.classList.add('win');
            currentRow++;
            if (currentRow >= totalRows) {
                endGame(true);
            } else {
                activateRow(currentRow);
            }
        } else {
            tg.HapticFeedback.notificationOccurred('error');
            cell.innerHTML = '🍏'; // Огрызок
            cell.classList.add('lose');
            endGame(false);
        }
    }

    function endGame(isFullWin) {
        document.getElementById('action-btn').style.display = 'block';
        document.querySelectorAll('.row').forEach(r => r.classList.remove('active'));
        if (isFullWin) {
            balance += 500;
            document.getElementById('win-msg').style.display = 'block';
        }
        updateBalance();
    }

    function updateBalance() {
        document.getElementById('balance').innerText = balance.toFixed(2);
    }

    initBoard();
</script>
</body>
</html>
