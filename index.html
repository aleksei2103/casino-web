<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #ffb900; --bg: #09090b; --card: rgba(25, 25, 28, 0.95); --green: #10b981; --red: #ef4444; }
        body { background: var(--bg); color: white; font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 12px; overflow: hidden; -webkit-user-select: none; }
        
        /* Стекляный дизайн */
        .glass { background: var(--card); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; }
        
        .header { display: flex; justify-content: space-between; padding: 15px 20px; margin-bottom: 15px; }
        .bal-val { color: var(--gold); font-size: 24px; font-weight: 800; text-shadow: 0 0 15px rgba(255,185,0,0.3); }

        .screen { display: none; animation: fadeIn 0.3s ease; }
        #lobby { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Лобби */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .game-card { padding: 25px 15px; text-align: center; transition: 0.2s; position: relative; overflow: hidden; }
        .game-card:active { transform: scale(0.95); background: rgba(255,255,255,0.05); }
        .game-card b { display: block; margin-top: 10px; font-size: 16px; }
        .game-card small { color: var(--green); font-weight: bold; }

        /* Сетки игр */
        .grid { display: grid; gap: 8px; margin: 20px 0; }
        .cell { background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.3s; }
        .cell.active-row { border-color: var(--gold); background: rgba(255,185,0,0.05); }
        .cell.win { background: var(--green) !important; border: none; box-shadow: 0 0 20px rgba(16,185,129,0.4); }
        .cell.lose { background: var(--red) !important; border: none; }

        /* Краш */
        .crash-display { height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .mult-text { font-size: 56px; font-weight: 900; background: linear-gradient(to bottom, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn { background: var(--gold); color: #000; border: none; width: 100%; padding: 18px; border-radius: 16px; font-weight: 700; font-size: 17px; margin-top: 8px; }
        .btn-back { background: transparent; color: #666; font-size: 14px; margin-top: 15px; }

        /* Уведомления */
        #notif { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 25px; border-radius: 30px; font-weight: bold; display: none; z-index: 100; }
    </style>
</head>
<body>

<div id="notif" class="glass"></div>

<div class="header glass">
    <div><small style="color:#666">BALANCE</small><br><span id="bal" class="bal-val">1000.00</span></div>
    <div style="text-align:right"><small style="color:#666">RANK</small><br><b style="color:var(--gold)">ELITE</b></div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen">
    <div class="game-grid">
        <div class="game-card glass" onclick="nav('apples')"><span style="font-size:40px">🍎</span><b>Apples</b><small>HOT</small></div>
        <div class="game-card glass" onclick="nav('crash')"><span style="font-size:40px">🚀</span><b>Crash</b><small>NEW</small></div>
        <div class="game-card glass" onclick="nav('mines')"><span style="font-size:40px">💣</span><b>Mines</b><small>POPULAR</small></div>
        <div class="game-card glass" style="opacity:0.4"><span style="font-size:40px">🎲</span><b>Dice</b><small>SOON</small></div>
    </div>
</div>

<!-- APPLES -->
<div id="apples-screen" class="screen">
    <div id="apples-board" class="grid" style="grid-template-rows:repeat(5,1fr)"></div>
    <button id="apple-act" class="btn" onclick="startApples()">PLACE BET 100</button>
    <button class="btn btn-back" onclick="toLobby()">← RETURN TO LOBBY</button>
</div>

<!-- CRASH -->
<div id="crash-screen" class="screen">
    <div class="crash-display glass">
        <div id="c-rocket" style="font-size:40px">🚀</div>
        <div id="c-mult" class="mult-text">1.00x</div>
    </div>
    <button id="c-start" class="btn" onclick="startCrash()">BET 100</button>
    <button id="c-stop" class="btn" style="display:none; background:var(--red); color:white" onclick="stopCrash()">CASH OUT</button>
    <button class="btn btn-back" onclick="toLobby()">← RETURN TO LOBBY</button>
</div>

<!-- MINES -->
<div id="mines-screen" class="screen">
    <div id="m-board" class="grid" style="grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(5,1fr)"></div>
    <button id="m-act" class="btn" onclick="startMines()">BET 100</button>
    <button class="btn btn-back" onclick="toLobby()">← RETURN TO LOBBY</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let balance = 1000, curRow = 0, cMult = 1.0, crashInt, mines = [], isGame = false;

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id + '-screen').style.display = 'block';
        if(id === 'apples') initApples();
        if(id === 'mines') initMines();
        tg.HapticFeedback.impactOccurred('light');
    }

    function toLobby() { location.reload(); }

    function showMsg(txt, color) {
        let n = document.getElementById('notif');
        n.innerText = txt; n.style.color = color; n.style.display = 'block';
        setTimeout(() => n.style.display = 'none', 2000);
    }

    function updateBal() { document.getElementById('bal').innerText = balance.toFixed(2); }

    // --- APPLES ---
    function initApples() {
        const b = document.getElementById('apples-board'); b.innerHTML = '';
        for(let i=4; i>=0; i--) {
            let r = document.createElement('div'); r.style = "display:grid; grid-template-columns:repeat(3,1fr); gap:8px";
            r.id = 'ar-'+i;
            for(let j=0; j<3; j++) {
                let c = document.createElement('div'); c.className = 'cell'; c.innerHTML = '🍏';
                c.onclick = () => stepApple(i, j); r.appendChild(c);
            }
            b.appendChild(r);
        }
    }
    function startApples() {
        if(balance < 100) return; balance -= 100; updateBal();
        curRow = 0; initApples();
        document.getElementById('ar-0').childNodes.forEach(c => c.classList.add('active-row'));
        document.getElementById('apple-act').style.display = 'none';
    }
    function stepApple(r, c) {
        if(r !== curRow) return;
        if(Math.random() > 0.35) {
            tg.HapticFeedback.impactOccurred('medium');
            let cell = document.getElementById('ar-'+r).children[c];
            cell.innerHTML = '🍎'; cell.classList.add('win');
            curRow++;
            if(curRow > 4) { balance += 402; updateBal(); showMsg('WIN +402!', 'var(--green)'); setTimeout(toLobby, 1500); }
            else { document.getElementById('ar-'+curRow).childNodes.forEach(node => node.classList.add('active-row')); }
        } else {
            tg.HapticFeedback.notificationOccurred('error');
            document.getElementById('ar-'+r).children[c].innerHTML = '💀';
            document.getElementById('ar-'+r).children[c].classList.add('lose');
            showMsg('LOSE', 'var(--red)'); setTimeout(toLobby, 1500);
        }
    }

    // --- CRASH ---
    function startCrash() {
        if(balance < 100) return; balance -= 100; updateBal();
        cMult = 1.0; isGame = true;
        let boom = (Math.random() * 5 + 1.1);
        document.getElementById('c-start').style.display = 'none';
        document.getElementById('c-stop').style.display = 'block';
        crashInt = setInterval(() => {
            cMult += 0.03;
            document.getElementById('c-mult').innerText = cMult.toFixed(2) + 'x';
            if(cMult >= boom) {
                clearInterval(crashInt); isGame = false;
                document.getElementById('c-mult').innerText = 'CRASHED';
                tg.HapticFeedback.notificationOccurred('error');
                setTimeout(toLobby, 1500);
            }
        }, 80);
    }
    function stopCrash() {
        if(!isGame) return; clearInterval(crashInt);
        let win = 100 * cMult; balance += win; updateBal();
        showMsg(`WIN +${win.toFixed(0)}`, 'var(--green)');
        tg.HapticFeedback.notificationOccurred('success');
        setTimeout(toLobby, 1500);
    }

    // --- MINES ---
    function initMines() {
        const g = document.getElementById('m-board'); g.innerHTML = '';
        for(let i=0; i<25; i++) {
            let c = document.createElement('div'); c.className = 'cell'; c.innerHTML = '💎';
            c.onclick = () => stepMine(i); g.appendChild(c);
        }
    }
    function startMines() {
        if(balance < 100) return; balance -= 100; updateBal();
        mines = []; while(mines.length < 4) { 
            let r = Math.floor(Math.random()*25); 
            if(!mines.includes(r)) mines.push(r); 
        }
        isGame = true; document.getElementById('m-act').innerText = 'CASH OUT (1.00x)';
        document.getElementById('m-act').onclick = stopMines;
    }
    function stepMine(i) {
        if(!isGame) return;
        let cell = document.getElementById('m-board').children[i];
        if(mines.includes(i)) {
            cell.innerHTML = '💣'; cell.classList.add('lose');
            tg.HapticFeedback.notificationOccurred('error');
            isGame = false; setTimeout(toLobby, 1500);
        } else {
            cell.innerHTML = '💎'; cell.classList.add('win');
            tg.HapticFeedback.impactOccurred('medium');
        }
    }
    function stopMines() { /* Логика выдачи */ toLobby(); }
</script>
</body>
</html>
