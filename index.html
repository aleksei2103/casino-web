<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: linear-gradient(135deg, #ffcf1b 0%, #ff8c00 100%);
            --bg: #050505;
            --card: rgba(28, 28, 33, 0.95);
            --green: #00ffa3;
            --red: #ff4757;
            --text: #ffffff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; padding: 0; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass { background: var(--card); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; }
        .screen { display: none; height: 100vh; overflow-y: auto; padding: 20px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* UI Elements */
        .balance-box { text-align: center; padding: 20px; background: var(--card); border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(255, 207, 27, 0.2); }
        .balance-val { font-size: 32px; font-weight: 900; background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-main { background: var(--gold); color: #000; border: none; width: 100%; padding: 18px; border-radius: 18px; font-weight: 800; font-size: 16px; margin: 5px 0; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .game-item { padding: 25px; text-align: center; border-radius: 20px; }

        /* Slots */
        .reels { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .reel { width: 80px; height: 100px; background: #000; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 1px solid #333; }
        .spinning { animation: blur 0.1s infinite; }
        @keyframes blur { 0%, 100% { filter: blur(0); } 50% { filter: blur(4px); } }

        /* Mines */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px auto; max-width: 300px; }
        .mine-cell { height: 55px; background: rgba(255,255,255,0.05); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }

        /* Crash */
        .crash-area { height: 200px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        #crash-rocket { font-size: 50px; transition: 0.1s; }
    </style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby" class="screen" style="display: block;">
    <div class="balance-box">
        <div style="font-size: 12px; color: #888;">USDT BALANCE</div>
        <div id="bal-val" class="balance-val">1000.00</div>
    </div>
    <div class="game-grid">
        <div class="game-item glass" onclick="nav('slots')">🎰<br>SLOTS</div>
        <div class="game-item glass" onclick="nav('mines')">💣<br>MINES</div>
        <div class="game-item glass" onclick="nav('crash')">🚀<br>CRASH</div>
        <div class="game-item glass" onclick="nav('profile')">👤<br>PROFILE</div>
    </div>
</div>

<!-- SLOTS -->
<div id="slots-screen" class="screen">
    <div class="reels">
        <div id="r1" class="reel">💎</div>
        <div id="r2" class="reel">💎</div>
        <div id="r3" class="reel">💎</div>
    </div>
    <button class="btn-main" onclick="playSlots()">SPIN (100)</button>
    <button class="btn-main" style="background:#222; color:#fff" onclick="nav('lobby')">BACK</button>
</div>

<!-- MINES -->
<div id="mines-screen" class="screen">
    <div id="m-status" style="text-align:center; margin-bottom:10px">МНОЖИТЕЛЬ: x1.00</div>
    <div id="m-grid" class="mines-grid"></div>
    <button id="m-btn" class="btn-main" onclick="startMines()">START (100)</button>
    <button class="btn-main" style="background:#222; color:#fff" onclick="nav('lobby')">BACK</button>
</div>

<!-- CRASH -->
<div id="crash-screen" class="screen">
    <div class="glass crash-area">
        <div id="crash-mult" style="font-size: 40px; font-weight: 900;">1.00x</div>
        <div id="crash-rocket">🚀</div>
    </div>
    <button id="c-btn" class="btn-main" onclick="startCrash()">BET (100)</button>
    <button class="btn-main" style="background:#222; color:#fff" onclick="nav('lobby')">BACK</button>
</div>

<!-- PROFILE -->
<div id="profile-screen" class="screen">
    <div class="glass" style="padding: 20px;">
        <h3>Личный кабинет</h3>
        <p>Имя: <b>Aleksey Pavlovich Turkeev</b></p>
        <p>Город: <b>Blagoveshchensk</b></p>
        <p>Специальность: <b>Master of Construction</b></p>
        <p>ID: <span id="user-id">21032004</span></p>
    </div>
    <button class="btn-main" style="margin-top:20px" onclick="nav('lobby')">BACK</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let balance = 1000;
    const syms = ['💎', '7️⃣', '🍒', '💰', '🍀'];

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id + (id==='lobby'||id==='profile'?'':'-screen')).style.display = 'block';
        tg.HapticFeedback.impactOccurred('light');
    }

    function upd() { document.getElementById('bal-val').innerText = balance.toFixed(2); }

    // SLOTS LOGIC
    function playSlots() {
        if(balance < 100) return;
        balance -= 100; upd();
        const rs = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
        rs.forEach(r => r.classList.add('spinning'));
        setTimeout(() => {
            let res = [];
            rs.forEach((r, i) => {
                setTimeout(() => {
                    r.classList.remove('spinning');
                    let s = syms[Math.floor(Math.random()*syms.length)];
                    r.innerText = s; res.push(s);
                    if(res.length===3) {
                        if(res[0]===res[1] && res[1]===res[2]) balance += 1000;
                        else if(res[0]===res[1] || res[1]===res[2]) balance += 150;
                        upd(); tg.HapticFeedback.notificationOccurred('success');
                    }
                }, i*400);
            });
        }, 1000);
    }

    // MINES LOGIC
    let mActive = false, mines = [], rev = 0;
    function startMines() {
        if(mActive) { balance += (100 * (1 + rev*0.2)); upd(); endMines('ВЫИГРЫШ!'); return; }
        if(balance < 100) return;
        balance -= 100; upd(); mActive = true; rev = 0; mines = [];
        while(mines.length < 3) { let r = Math.floor(Math.random()*25); if(!mines.includes(r)) mines.push(r); }
        const g = document.getElementById('m-grid'); g.innerHTML = '';
        for(let i=0; i<25; i++) {
            let c = document.createElement('div'); c.className = 'mine-cell glass';
            c.onclick = () => {
                if(!mActive || c.innerText !== '') return;
                if(mines.includes(i)) { c.innerText = '💣'; c.style.background = 'var(--red)'; endMines('BOOM!'); }
                else { c.innerText = '💎'; c.style.background = 'var(--green)'; rev++; 
                document.getElementById('m-status').innerText = `x${(1 + rev*0.2).toFixed(2)}`; }
            };
            g.appendChild(c);
        }
        document.getElementById('m-btn').innerText = 'CASH OUT';
    }
    function endMines(m) { mActive = false; document.getElementById('m-status').innerText = m; document.getElementById('m-btn').innerText = 'START (100)'; }

    // CRASH LOGIC
    let cInt, cVal = 1.0;
    function startCrash() {
        if(balance < 100) return;
        balance -= 100; upd(); cVal = 1.0;
        let boom = Math.random() * 4 + 1.1;
        const btn = document.getElementById('c-btn'); btn.innerText = 'CASH OUT';
        btn.onclick = () => {
            clearInterval(cInt); balance += (100 * cVal); upd();
            btn.innerText = 'BET (100)'; btn.onclick = startCrash;
        };
        cInt = setInterval(() => {
            cVal += 0.05; document.getElementById('crash-mult').innerText = cVal.toFixed(2) + 'x';
            if(cVal >= boom) {
                clearInterval(cInt); document.getElementById('crash-mult').innerText = 'BOOM!';
                btn.innerText = 'BET (100)'; btn.onclick = startCrash;
            }
        }, 100);
    }
</script>
</body>
</html>
