<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #f39c12; --bg: #0b0b0c; --card: #161618; --green: #2ecc71; --red: #ff4757; --blue: #54a0ff; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 10px; overflow: hidden; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; background: var(--card); padding: 12px 18px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #222; }
        .bal-title { font-size: 10px; color: #888; letter-spacing: 1px; }
        .bal-amount { color: var(--gold); font-size: 22px; font-weight: 900; }

        /* Lobby */
        #lobby { display: block; height: 80vh; overflow-y: auto; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card); border-radius: 20px; padding: 15px; border: 1px solid #222; text-align: center; position: relative; }
        .card.hot::before { content: 'HOT'; position: absolute; top: 8px; right: 8px; background: var(--red); font-size: 8px; padding: 2px 6px; border-radius: 5px; font-weight: bold; }
        .card .icon { font-size: 40px; margin-bottom: 10px; display: block; }
        .card b { font-size: 14px; display: block; margin-bottom: 4px; }
        .card span { font-size: 10px; color: var(--green); }

        /* Crash Game */
        #crash-screen { display: none; text-align: center; }
        .crash-area { background: var(--card); height: 220px; border-radius: 25px; margin: 20px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #222; position: relative; overflow: hidden; }
        #rocket { font-size: 50px; transition: 0.1s; position: relative; z-index: 2; }
        #multiplier { font-size: 45px; font-weight: 900; color: white; margin-top: 10px; z-index: 2; }
        .crash-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(to top, rgba(84, 160, 255, 0.1), transparent); transition: 0.1s; }

        .btn { background: var(--gold); color: black; border: none; width: 100%; padding: 18px; border-radius: 18px; font-weight: bold; font-size: 18px; transition: 0.2s; }
        .btn:active { transform: scale(0.96); }
        .btn-stop { background: var(--red); display: none; color: white; }
    </style>
</head>
<body>

<div class="header">
    <div><div class="bal-title">MY WALLET</div><div id="balance" class="bal-amount">1000.00</div></div>
    <div style="text-align: right;"><div class="bal-title">VIP STATUS</div><div style="color: var(--blue)">DIAMOND</div></div>
</div>

<div id="lobby">
    <div class="game-grid">
        <div class="card hot" onclick="openGame('apples')">
            <span class="icon">🍎</span><b>Apples</b><span>x4.02 Max</span>
        </div>
        <div class="card" onclick="openGame('crash')">
            <span class="icon">🚀</span><b>Crash</b><span>Unlimited</span>
        </div>
        <div class="card" style="opacity: 0.4;">
            <span class="icon">💣</span><b>Mines</b><span>Soon</span>
        </div>
        <div class="card" style="opacity: 0.4;">
            <span class="icon">🎡</span><b>Wheel</b><span>Soon</span>
        </div>
    </div>
</div>

<!-- Экран КРАШ -->
<div id="crash-screen">
    <div class="crash-area">
        <div id="rocket">🚀</div>
        <div id="multiplier">1.00x</div>
        <div id="crash-bg" class="crash-bg"></div>
    </div>
    <button id="crash-start" class="btn" onclick="startCrash()">BET 100</button>
    <button id="crash-stop" class="btn btn-stop" onclick="stopCrash()">CASH OUT</button>
    <button class="btn" style="background:#222; color:white; margin-top:10px;" onclick="location.reload()">LOBBY</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let balance = 1000;
    let crashInterval;
    let currentMult = 1.00;
    let isCrashed = false;

    function openGame(game) {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById(game + '-screen').style.display = 'block';
    }

    // ЛОГИКА CRASH
    function startCrash() {
        if(balance < 100) return;
        balance -= 100;
        updateUI();
        
        isCrashed = false;
        currentMult = 1.00;
        let crashPoint = (Math.random() * 5 + 1).toFixed(2); // Рандомный момент взрыва
        
        document.getElementById('crash-start').style.display = 'none';
        document.getElementById('crash-stop').style.display = 'block';
        document.getElementById('rocket').style.transform = 'translateY(0px)';
        document.getElementById('multiplier').style.color = 'white';

        crashInterval = setInterval(() => {
            currentMult += 0.01;
            document.getElementById('multiplier').innerText = currentMult.toFixed(2) + 'x';
            
            // Вибрация нарастает
            if(currentMult > 2) tg.HapticFeedback.impactOccurred('light');

            // Визуальный подъем
            let shift = (currentMult - 1) * 15;
            document.getElementById('rocket').style.transform = `translateY(-${shift}px) rotate(${-shift/2}deg)`;
            document.getElementById('crash-bg').style.height = (currentMult * 10) + '%';

            if(currentMult >= crashPoint) {
                doCrash();
            }
        }, 50);
    }

    function doCrash() {
        clearInterval(crashInterval);
        isCrashed = true;
        tg.HapticFeedback.notificationOccurred('error');
        document.getElementById('multiplier').innerText = 'BOOM!';
        document.getElementById('multiplier').style.color = var(--red);
        document.getElementById('rocket').innerHTML = '💥';
        
        setTimeout(() => {
            document.getElementById('rocket').innerHTML = '🚀';
            document.getElementById('crash-start').style.display = 'block';
            document.getElementById('crash-stop').style.display = 'none';
        }, 2000);
    }

    function stopCrash() {
        if(isCrashed) return;
        clearInterval(crashInterval);
        let win = 100 * currentMult;
        balance += win;
        updateUI();
        tg.HapticFeedback.notificationOccurred('success');
        
        document.getElementById('multiplier').style.color = var(--green);
        setTimeout(() => location.reload(), 1500);
    }

    function updateUI() {
        document.getElementById('balance').innerText = balance.toFixed(2);
    }
</script>
</body>
</html>
