<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1c1c1e; color: white; font-family: -apple-system, sans-serif; text-align: center; padding: 20px; }
        .card { background: #2c2c2e; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #f39c12; }
        .balance { font-size: 28px; color: #f39c12; font-weight: bold; }
        .btn { background: #f39c12; color: black; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 12px; color: #8e8e93;">БАЛАНС</div>
        <div class="balance">1000.00 USDT</div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div style="background: #2c2c2e; padding: 20px; border-radius: 12px;">🍎<br>Apples</div>
        <div style="background: #2c2c2e; padding: 20px; border-radius: 12px; opacity: 0.5;">🎲<br>Скоро</div>
    </div>
    <br>
    <button class="btn" onclick="window.Telegram.WebApp.close()">ЗАКРЫТЬ</button>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
