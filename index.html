<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: linear-gradient(135deg, #ffcf1b 0%, #ff8c00 100%); --bg: #050505; --card: rgba(30, 30, 35, 0.7); --green: #00ff88; --red: #ff3344; }
        body { background: var(--bg); color: white; font-family: 'SF Pro Display', -apple-system, sans-serif; margin: 0; padding: 15px; overflow: hidden; }
        
        /* Glassmorphism */
        .glass { background: var(--card); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .header { display: flex; justify-content: space-between; padding: 18px; margin-bottom: 20px; }
        .bal-val { background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 26px; font-weight: 900; }

        /* Lobby Animations */
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .game-card { padding: 30px 10px; text-align: center; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); animation: pulse 4s infinite ease-in-out; }
        .game-card:active { transform: scale(0.92); }
        .game-icon { width: 60px; height: 60px; margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }

        /* Game Grids */
        .grid { display: grid; gap: 10px; margin: 20px 0; }
        .cell { aspect-ratio: 1/1; background: rgba(255,255,255,0.03); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; transition: 0.4s; }
        .cell img { width: 70%; height: 70%; object-fit: contain; }
        .win-glow { box-shadow: 0 0 20px var(--green); border-color: var(--green); background: rgba(0,255,136,0.1); }
        
        /* Crash Rocket */
        .rocket-path { height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .mult-anim { font-size: 60px; font-weight: 900; text-shadow: 0 0 20px rgba(255,255,255,0.2); }

        /* Buttons */
        .btn-main { background: var(--gold); border: none; color: #000; width: 100%; padding: 20px; border-radius: 20px; font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 5px 15px rgba(255,140,0,0.3); }
        .btn-main:active { transform: translateY(2px); box-shadow: none; }

        /* Shake Effect for Lose */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.2s ease-in-out 3; }
    </style>
</head>
<body>

<div class="header glass">
    <div><small style="opacity: 0.5;">YOUR WALLET</small><br><span id="bal" class="bal-val">1000.00</span></div>
    <div style="text-align: right;"><small style="opacity: 0.5;">RANK</small><br><b style="color:#ffcf1b">DIAMOND</b></div>
</div>

<div id="lobby" class="screen">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="game-card glass" onclick="nav('apples')">
            <img src="https://cdn-icons-png.flaticon.com/512/415/415733.png" class="game-icon">
            <b>Apples</b><br><small style="color:var(--green)">+400% PROFIT</small>
        </div>
        <div class="game-card glass" onclick="nav('crash')">
            <img src="https://cdn-icons-png.flaticon.com/512/1356/1356479.png" class="game-icon">
            <b>Crash</b><br><small style="color:var(--green)">HIGH RISK</small>
        </div>
    </div>
</div>

<div id="apples-screen" class="screen" style="display:none;">
    <div id="apples-board" class="grid" style="grid-template-rows:repeat(5,1fr)"></div>
    <button id="apple-act" class="btn-main" onclick="startApples()">PLACE BET 100</button>
    <button style="background:none; border:none; color:#555; width:100%; margin-top:15px;" onclick="location.reload()">BACK TO LOBBY</button>
</div>

<!-- Остальные экраны подключаются аналогично по логике nav() -->

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let balance = 1000;
    let curRow = 0;

    function nav(id) {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById(id + '-screen').style.display = 'block';
        if(id === 'apples') initApples();
        tg.HapticFeedback.impactOccurred('medium');
    }

    function updateBal() { document.getElementById('bal').innerText = balance.toFixed(2); }

    function initApples() {
        const board = document.getElementById('apples-board');
        board.innerHTML = '';
        for(let i=4; i>=0; i--) {
            let row = document.createElement('div');
            row.style = "display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:10px;";
            row.id = 'r-'+i;
            for(let j=0; j<3; j++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerHTML = '<img src="https://cdn-icons-png.flaticon.com/512/1532/1532540.png" style="opacity:0.2">';
                cell.onclick = () => stepApple(i, j);
                row.appendChild(cell);
            }
            board.appendChild(row);
        }
    }

    function startApples() {
        if(balance < 100) return;
        balance -= 100; updateBal();
        curRow = 0;
        document.getElementById('apple-act').style.display = 'none';
        // Подсвечиваем первый ряд
        Array.from(document.getElementById('r-0').children).forEach(c => c.style.borderColor = '#ffcf1b');
    }

    function stepApple(r, c) {
        if(r !== curRow) return;
        let cell = document.getElementById('r-'+r).children[c];
        
        if(Math.random() > 0.3) {
            cell.innerHTML = '<img src="https://cdn-icons-png.flaticon.com/512/415/415733.png">';
            cell.classList.add('win-glow');
            tg.HapticFeedback.impactOccurred('heavy');
            curRow++;
            if(curRow > 4) {
                balance += 402; updateBal();
                tg.HapticFeedback.notificationOccurred('success');
                setTimeout(() => location.reload(), 2000);
            }
        } else {
            cell.innerHTML = '<img src="https://cdn-icons-png.flaticon.com/512/1791/1791384.png">';
            document.body.classList.add('shake');
            tg.HapticFeedback.notificationOccurred('error');
            setTimeout(() => location.reload(), 1500);
        }
    }
</script>
</body>
</html>
