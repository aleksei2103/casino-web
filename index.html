<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #f39c12; --bg: #0b0b0c; --card: #161618; --green: #2ecc71; --red: #ff4757; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 10px; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; background: var(--card); padding: 15px; border-radius: 20px; margin-bottom: 10px; border: 1px solid #222; }
        .bal-amount { color: var(--gold); font-size: 20px; font-weight: 900; }

        /* Экраны */
        .screen { display: none; height: 85vh; overflow-y: auto; }
        #lobby { display: block; }

        /* Лобби */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #222; text-align: center; }
        .card .icon { font-size: 40px; display: block; margin-bottom: 5px; }

        /* Игры */
        .grid { display: grid; gap: 8px; margin: 15px 0; }
        .cell { background: var(--card); border-radius: 10px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; height: 50px; font-size: 20px; }
        .win { border-color: var(--green); background: rgba(46, 204, 113, 0.1); }
        
        /* Краш зона */
        .crash-box { background: var(--card); height: 180px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #222; margin-bottom: 15px; }

        .btn { background: var(--gold); color: black; border: none; width: 100%; padding: 16px; border-radius: 15px; font-weight: bold; font-size: 16px; margin-top: 5px; }
        .btn-back { background: #222; color: white; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div><small style="color:#888">БАЛАНС</small><br><span id="balance" class="bal-amount">1000.00</span></div>
    <div style="text-align:right"><small style="color:#888">USER ID</small><br><span>#2103</span></div>
</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="lobby" class="screen">
    <div class="game-grid">
        <div class="card" onclick="showScreen('apples')"><span class="icon">🍎</span><b>Apples</b></div>
        <div class="card" onclick="showScreen('crash')"><span class="icon">🚀</span><b>Crash</b></div>
        <div class="card" onclick="showScreen('mines')"><span class="icon">💣</span><b>Mines</b></div>
        <div class="card" style="opacity:0.3"><span class="icon">🎲</span><b>Dice</b></div>
    </div>
</div>

<!-- ЭКРАН ЯБЛОК -->
<div id="apples-screen" class="screen">
    <div id="apples-board" style="display:grid; grid-template-rows:repeat(5,1fr); gap:8px;"></div>
    <button id="apples-bet" class="btn" onclick="startApples()">СТАВКА 100</button>
    <button class="btn btn-back" onclick="location.reload()">НАЗАД</button>
</div>

<!-- ЭКРАН КРАША -->
<div id="crash-screen" class="screen">
    <div class="crash-box">
        <div id="rocket" style="font-size:40px">🚀</div>
        <div id="mult" style="font-size:35px; font-weight:900">1.00x</div>
    </div>
    <button id="crash-bet" class="btn" onclick="startCrash()">СТАВКА 100</button>
    <button id="crash-cash" class="btn" style="display:none; background:var(--green)" onclick="stopCrash()">ЗАБРАТЬ</button>
    <button class="btn btn-back" onclick="location.reload()">НАЗАД</button>
</div>

<!-- ЭКРАН МИН -->
<div id="mines-screen" class="screen">
    <div id="mines-grid" class="grid" style="grid-template-columns:repeat(5,1fr)"></div>
    <button id="mines-bet" class="btn" onclick="startMines()">СТАВКА 100</button>
    <button class="btn btn-back" onclick="location.reload()">НАЗАД</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let balance = 1000;
    let curRow = 0;
    let crashInt;
    let cMult = 1.0;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id + '-screen').style.display = 'block';
        if(id === 'apples') initApples();
        if(id === 'mines') initMines();
    }

    function updateBal() { document.getElementById('balance').innerText = balance.toFixed(2); }

    // --- APPLES ---
    function initApples() {
        const b = document.getElementById('apples-board'); b.innerHTML = '';
        for(let i=4; i>=0; i--) {
            let r = document.createElement('div'); r.style = "display:grid; grid-template-columns:repeat(3,1fr); gap:8px; opacity:0.3";
            r.id = 'row-'+i;
            for(let j=0; j<3; j++) {
                let c = document.createElement('div'); c.className = 'cell'; c.innerHTML = '🍏';
                c.onclick = () => stepApple(i, j);
                r.appendChild(c);
            }
            b.appendChild(r);
        }
    }
    function startApples() {
        if(balance < 100) return;
        balance -= 100; updateBal(); curRow = 0;
        initApples(); document.getElementById('row-0').style.opacity = '1';
        document.getElementById('apples-bet').style.display = 'none';
    }
    function stepApple(r, c) {
        if(r !== curRow) return;
        if(Math.random() > 0.33) {
            tg.HapticFeedback.impactOccurred('medium');
            document.getElementById('row-'+r).children[c].innerHTML = '🍎';
            document.getElementById('row-'+r).children[c].classList.add('win');
            document.getElementById('row-'+r).style.opacity = '0.3';
            curRow++;
            if(curRow > 4) { balance += 400; updateBal(); tg.HapticFeedback.notificationOccurred('success'); location.reload(); }
            else { document.getElementById('row-'+curRow).style.opacity = '1'; }
        } else { location.reload(); }
    }

    // --- CRASH ---
    function startCrash() {
        if(balance < 100) return;
        balance -= 100; updateBal(); cMult = 1.0;
        let boom = (Math.random() * 4 + 1.1);
        document.getElementById('crash-bet').style.display = 'none';
        document.getElementById('crash-cash').style.display = 'block';
        crashInt = setInterval(() => {
            cMult += 0.02;
            document.getElementById('mult').innerText = cMult.toFixed(2) + 'x';
            if(cMult >= boom) {
                clearInterval(crashInt);
                document.getElementById('mult').innerText = 'BOOM!';
                tg.HapticFeedback.notificationOccurred('error');
                setTimeout(() => location.reload(), 1500);
            }
        }, 100);
    }
    function stopCrash() {
        clearInterval(crashInt);
        balance += (100 * cMult); updateBal();
        tg.HapticFeedback.notificationOccurred('success');
        location.reload();
    }

    // --- MINES ---
    function initMines() {
        const g = document.getElementById('mines-grid'); g.innerHTML = '';
        for(let i=0; i<25; i++) {
            let c = document.createElement('div'); c.className = 'cell'; c.innerHTML = '💎';
            g.appendChild(c);
        }
    }
    function startMines() { /* Логика как в яблоках, но на поле 5х5 */ }
</script>
</body>
</html>
