<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: linear-gradient(135deg, #ffcf1b 0%, #ff8c00 100%);
            --bg: #050505;
            --card: rgba(28, 28, 33, 0.9);
            --green: #00ffa3;
            --red: #ff4757;
            --text: #ffffff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-user-select: none;
        }

        .glass {
            background: var(--card);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
        }

        /* Header */
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .balance-box { background: rgba(255, 255, 255, 0.03); padding: 10px 20px; border-radius: 15px; border: 1px solid rgba(255, 207, 27, 0.2); }
        .balance-amount { background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 24px; font-weight: 900; }

        /* Screens */
        .screen { display: none; padding: 20px; height: 80vh; overflow-y: auto; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Game Grid */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .game-card { padding: 30px 15px; text-align: center; transition: 0.2s; }
        .game-card i { font-size: 40px; display: block; margin-bottom: 10px; }

        /* Slots Engine */
        .slots-box { display: flex; justify-content: center; gap: 10px; padding: 40px 10px; margin: 20px 0; position: relative; }
        .reel { width: 80px; height: 100px; background: #000; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 45px; border: 2px solid #222; }
        .spinning { animation: blur 0.1s infinite; }
        @keyframes blur { 0% { filter: blur(0); } 50% { filter: blur(4px); } 100% { filter: blur(0); } }

        /* Buttons */
        .btn-play { background: var(--gold); color: #000; border: none; width: 100%; padding: 18px; border-radius: 18px; font-weight: 800; font-size: 18px; box-shadow: 0 10px 20px rgba(255, 140, 0, 0.2); margin-top: 10px; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-around; padding: 15px; position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 100; }
        .nav-item { font-size: 24px; opacity: 0.5; transition: 0.3s; }
        .nav-item.active { opacity: 1; transform: scale(1.2); }
    </style>
</head>
<body>

<div class="header">
    <div class="balance-box">
        <small style="color: #666;">БАЛАНС</small><br>
        <span id="bal" class="balance-amount">1000.00</span>
    </div>
    <div onclick="show('profile')" style="background: var(--gold); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold;">AT</div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen" style="display: block;">
    <h2 style="margin: 0;">Привет, Алексей!</h2>
    <div class="game-grid">
        <div class="game-card glass" onclick="show('slots')"><i>🎰</i><b>Slots</b></div>
        <div class="game-card glass" onclick="show('crash')"><i>🚀</i><b>Crash</b></div>
        <div class="game-card glass" onclick="show('mines')"><i>💣</i><b>Mines</b></div>
        <div class="game-card glass" onclick="show('profile')"><i>👤</i><b>Профиль</b></div>
    </div>
</div>

<!-- SLOTS SCREEN -->
<div id="slots-screen" class="screen">
    <div class="slots-box glass">
        <div id="r1" class="reel">💎</div>
        <div id="r2" class="reel">💎</div>
        <div id="r3" class="reel">💎</div>
    </div>
    <button class="btn-play" onclick="spin()">КРУТИТЬ (100)</button>
    <button class="btn-play" style="background: #222; color: #fff;" onclick="show('lobby')">НАЗАД</button>
</div>

<!-- PROFILE SCREEN -->
<div id="profile-screen" class="screen">
    <div class="glass" style="padding: 20px;">
        <h3 style="margin-top:0;">Карточка Мастера</h3>
        <p>Имя: <b>Aleksey Pavlovich Turkeev</b></p>
        <p>Дата рождения: <b>21.03.2004</b></p>
        <p>Город: <b>Blagoveshchensk</b></p>
        <p>Ранг: <b style="color:#ffcf1b;">MASTER OF CONSTRUCTION</b></p>
        <hr style="border: 0.5px solid #333;">
        <p style="font-size: 12px; color: #888;">Ваш профиль синхронизирован с системой арбитража трафика.</p>
    </div>
    <button class="btn-play" onclick="show('lobby')">В ЛОББИ</button>
</div>

<div class="navbar glass">
    <div class="nav-item" onclick="show('lobby')">🏠</div>
    <div class="nav-item" onclick="show('slots')">🎰</div>
    <div class="nav-item" onclick="show('profile')">👤</div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let balance = 1000;
    const symbols = ['💎', '7️⃣', '🍒', '💰', '🍀'];

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        const target = id === 'lobby' || id === 'profile' ? id : id + '-screen';
        document.getElementById(target).style.display = 'block';
        tg.HapticFeedback.impactOccurred('light');
    }

    function updateBal() {
        document.getElementById('bal').innerText = balance.toFixed(2);
    }

    function spin() {
        if(balance < 100) return;
        balance -= 100; updateBal();
        
        const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
        reels.forEach(r => r.classList.add('spinning'));

        setTimeout(() => {
            let res = [];
            reels.forEach((r, i) => {
                setTimeout(() => {
                    r.classList.remove('spinning');
                    let s = symbols[Math.floor(Math.random() * symbols.length)];
                    r.innerText = s;
                    res.push(s);
                    if(res.length === 3) check(res);
                }, i * 500);
            });
        }, 1000);
    }

    function check(res) {
        if(res[0] === res[1] && res[1] === res[2]) {
            balance += 1000;
            tg.HapticFeedback.notificationOccurred('success');
        } else if(res[0] === res[1] || res[1] === res[2] || res[0] === res[2]) {
            balance += 150;
            tg.HapticFeedback.impactOccurred('medium');
        }
        updateBal();
    }
</script>
</body>
</html>
