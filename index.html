<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: linear-gradient(135deg, #ffcf1b 0%, #ff8c00 100%);
            --bg: #050505;
            --card: rgba(28, 28, 33, 0.95);
            --green: #00ffa3;
            --red: #ff4757;
            --text: #ffffff;
            --accent: #5856d6;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
        }

        /* Header & Level Bar */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .lvl-container { width: 100%; height: 6px; background: #222; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .lvl-progress { height: 100%; background: var(--gold); width: 45%; transition: 0.5s; }

        /* Balance Display */
        .balance-card { text-align: center; padding: 20px 0; }
        .balance-val { font-size: 36px; font-weight: 900; background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Grid */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .game-item { padding: 25px 10px; text-align: center; position: relative; overflow: hidden; }
        .game-item i { font-size: 32px; display: block; margin-bottom: 8px; }
        .game-item span { font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }

        /* Professional Slots */
        .slots-engine { display: flex; justify-content: center; gap: 8px; padding: 30px 10px; margin: 15px; background: rgba(0,0,0,0.4); border-radius: 20px; }
        .reel { 
            width: 85px; height: 110px; background: #111; border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 48px; border: 1px solid #333;
            transition: transform 0.1s cubic-bezier(.17,.67,.83,.67);
        }
        .spin-anim { animation: reelSpin 0.1s infinite linear; }
        @keyframes reelSpin { 0% { transform: translateY(-5px); filter: blur(2px); } 50% { transform: translateY(5px); filter: blur(5px); } 100% { transform: translateY(-5px); filter: blur(2px); } }

        /* Action Buttons */
        .btn-main {
            background: var(--gold); color: #000; border: none; width: 90%; margin: 10px 5%;
            padding: 20px; border-radius: 20px; font-weight: 900; font-size: 18px;
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.3);
        }

        .screen { display: none; height: 100vh; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Profile Special */
        .master-badge {
            background: rgba(255, 207, 27, 0.1); border: 1px solid var(--gold);
            padding: 5px 12px; border-radius: 10px; font-size: 12px; color: #ffcf1b; font-weight: 700;
        }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: block;">
    <div class="header">
        <div>
            <div style="font-size: 12px; color: #888;">ДОБРО ПОЖАЛОВАТЬ</div>
            <div style="font-weight: 900;">АЛЕКСЕЙ ТУРКЕЕВ</div>
        </div>
        <div class="master-badge">MASTER</div>
    </div>

    <div class="balance-card">
        <div id="main-bal" class="balance-val">1,000.00</div>
        <div style="font-size: 12px; color: #666; letter-spacing: 2px;">ТЕКУЩИЙ БАЛАНС (USDT)</div>
    </div>

    <div class="game-grid">
        <div class="game-item glass" onclick="nav('slots')"><i>🎰</i><span>SLOTS</span></div>
        <div class="game-item glass" onclick="nav('crash')"><i>🚀</i><span>CRASH</span></div>
        <div class="game-item glass" onclick="nav('mines')"><i>💣</i><span>MINES</span></div>
        <div class="game-item glass" onclick="nav('profile')"><i>👤</i><span>ПРОФИЛЬ</span></div>
    </div>
</div>

<!-- SLOTS PRO -->
<div id="slots-screen" class="screen">
    <div style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
        <button onclick="nav('lobby')" style="background:none; border:none; color:#fff; font-size:24px;">✕</button>
        <div style="font-weight: 800;">PREMIUM SLOTS</div>
        <div></div>
    </div>

    <div class="slots-engine">
        <div id="rl1" class="reel">💎</div>
        <div id="rl2" class="reel">7️⃣</div>
        <div id="rl3" class="reel">💎</div>
    </div>

    <div style="text-align: center; margin: 20px;">
        <small style="color:#666">СТАВКА: 100 USDT</small>
    </div>
    
    <button class="btn-main" onclick="startSpin()">SPIN</button>
</div>

<!-- PROFILE -->
<div id="profile-screen" class="screen">
    <div style="padding: 30px 20px;">
        <div class="glass" style="padding: 25px; text-align: center;">
            <div style="width: 80px; height: 80px; background: var(--gold); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #000; font-weight: 900;">AT</div>
            <h2 style="margin: 0;">Алексей Туркеев</h2>
            <p style="color: #666;">Благовещенск, Амурская обл.</p>
            
            <div class="lvl-container"><div class="lvl-progress"></div></div>
            <div style="display: flex; justify-content: space-between; font-size: 10px; margin-top: 5px; color: #ffcf1b;">
                <span>LVL 24</span>
                <span>EXP 4500/10000</span>
            </div>
        </div>
        
        <button class="btn-main" style="background: #222; color: #fff; margin-top: 20px;" onclick="nav('lobby')">ВЕРНУТЬСЯ</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    tg.backgroundColor = "#050505";
    tg.headerColor = "#050505";

    let balance = 1000;
    const items = ['💎', '7️⃣', '🍒', '🍋', '💰', '🍀'];

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id + (id === 'lobby' || id === 'profile' ? '' : '-screen')).style.display = 'block';
        tg.HapticFeedback.impactOccurred('light');
    }

    function startSpin() {
        if(balance < 100) return;
        balance -= 100;
        document.getElementById('main-bal').innerText = balance.toFixed(2);
        
        const r1 = document.getElementById('rl1');
        const r2 = document.getElementById('rl2');
        const r3 = document.getElementById('rl3');

        r1.classList.add('spin-anim');
        r2.classList.add('spin-anim');
        r3.classList.add('spin-anim');
        
        tg.HapticFeedback.impactOccurred('heavy');

        setTimeout(() => stopReel(r1, 0), 1000);
        setTimeout(() => stopReel(r2, 1), 1500);
        setTimeout(() => stopReel(r3, 2), 2000);
    }

    function stopReel(reel, i) {
        reel.classList.remove('spin-anim');
        let res = items[Math.floor(Math.random() * items.length)];
        reel.innerText = res;
        tg.HapticFeedback.impactOccurred('medium');
        
        if(i === 2) {
            // Здесь будет логика проверки выигрыша
            tg.HapticFeedback.notificationOccurred('success');
        }
    }
</script>
</body>
</html>
