<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: linear-gradient(135deg, #ffcf1b 0%, #ff8c00 100%);
            --bg: #0a0a0c;
            --card: #16161e;
            --accent: #5856d6;
            --green: #34c759;
            --red: #ff3b30;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 0; overflow: hidden;
        }

        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; }
        .screen { display: none; height: 100vh; padding: 15px; box-sizing: border-box; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; }
        .balance-display { font-size: 28px; font-weight: 800; background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Game Cards */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .card { padding: 25px 15px; text-align: center; font-weight: 700; font-size: 14px; position: relative; }
        .card i { font-size: 35px; display: block; margin-bottom: 10px; }

        /* Crash Game Visual */
        #crash-box { height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin-bottom: 20px; border: 2px dashed #333; }
        .rocket-anim { font-size: 50px; position: absolute; bottom: 10px; left: 10px; transition: all 0.1s linear; }

        .btn { background: var(--gold); color: black; border: none; width: 100%; padding: 18px; border-radius: 15px; font-weight: 900; font-size: 16px; margin-top: 10px; }
        .btn-back { background: #2c2c2e; color: white; margin-top: 10px; }

        /* Animation for Slots */
        .blur { filter: blur(4px); }
    </style>
</head>
<body>

<div id="lobby" class="screen" style="display: block;">
    <div class="header">
        <div>
            <div style="font-size: 11px; color: #888; letter-spacing: 1px;">WELCOME, MASTER</div>
            <div style="font-weight: 800;">ALEXEY TURKEEV</div>
        </div>
        <div class="balance-display" id="b-lobby">1000.00</div>
    </div>
    
    <div class="grid">
        <div class="card glass" onclick="nav('slots')"><i>🎰</i>SLOTS</div>
        <div class="card glass" onclick="nav('crash')"><i>🚀</i>CRASH</div>
        <div class="card glass" onclick="nav('mines')"><i>💣</i>MINES</div>
        <div class="card glass" onclick="nav('profile')"><i>👤</i>PROFILE</div>
    </div>
    
    <div class="glass" style="margin-top: 15px; padding: 15px; font-size: 12px;">
        <span style="color: var(--green)">●</span> Live: Пользователь из Благовещенска +450 USDT
    </div>
</div>

<div id="crash-screen" class="screen">
    <h2 style="text-align: center;">CRASH</h2>
    <div id="crash-box" class="glass">
        <div id="c-mult" style="font-size: 45px; font-weight: 900;">1.00x</div>
        <div id="rocket" class="rocket-anim">🚀</div>
    </div>
    <button id="c-btn" class="btn" onclick="runCrash()">СТАВКА 100</button>
    <button class="btn btn-back" onclick="nav('lobby')">НАЗАД</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let bal = 1000;

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id + (id === 'lobby' || id === 'profile' ? '' : '-screen')).style.display = 'block';
        updateUI();
    }

    function updateUI() {
        document.querySelectorAll('.balance-display, #b-lobby').forEach(el => el.innerText = bal.toFixed(2));
    }

    // CRASH LOGIC
    let cTicker, cVal = 1.0, isFlying = false;
    function runCrash() {
        const btn = document.getElementById('c-btn');
        if(isFlying) { // CASH OUT
            clearInterval(cTicker);
            bal += 100 * cVal;
            isFlying = false;
            btn.innerText = "ЗАБРАЛ " + (100 * cVal).toFixed(0);
            tg.HapticFeedback.notificationOccurred('success');
            setTimeout(() => { btn.innerText = "СТАВКА 100"; updateUI(); resetRocket(); }, 2000);
            return;
        }

        if(bal < 100) return;
        bal -= 100; updateUI();
        isFlying = true; cVal = 1.0;
        let crashAt = (Math.random() * 5 + 1.1).toFixed(2);
        btn.innerText = "ВЫВЕСТИ";
        
        const rocket = document.getElementById('rocket');
        cTicker = setInterval(() => {
            cVal += 0.03;
            document.getElementById('c-mult').innerText = cVal.toFixed(2) + "x";
            rocket.style.bottom = (cVal * 20) + "px";
            rocket.style.left = (cVal * 15) + "px";
            
            if(cVal >= crashAt) {
                clearInterval(cTicker);
                isFlying = false;
                document.getElementById('c-mult').style.color = 'var(--red)';
                document.getElementById('c-mult').innerText = "BOOM!";
                tg.HapticFeedback.notificationOccurred('error');
                setTimeout(() => { 
                    resetRocket();
                    btn.innerText = "СТАВКА 100";
                }, 2000);
            }
        }, 100);
    }

    function resetRocket() {
        document.getElementById('c-mult').style.color = 'white';
        document.getElementById('c-mult').innerText = "1.00x";
        document.getElementById('rocket').style.bottom = "10px";
        document.getElementById('rocket').style.left = "10px";
    }
</script>
</body>
</html>
